      <rect x="940" y="266" width="70" height="7" rx="3.5"/><rect x="940" y="277" width="44" height="5" rx="2.5" opacity=".6"/>
      <rect x="940" y="312" width="86" height="7" rx="3.5"/><rect x="940" y="323" width="56" height="5" rx="2.5" opacity=".6"/>
