    <clipPath id="typeClip"><rect x="112" y="225" height="44" width="306"><animate attributeName="width" values="0;18;36;54;72;90;108;126;144;162;180;198;216;234;252;270;288;306;306;306;306;306;306;306;306;306;306;306;306;306;306;306;306;288;270;252;234;216;198;180;162;144;126;108;90;72;54;36;18;0;0;0;0;0;0" dur="7s" calcMode="discrete" repeatCount="indefinite"/></rect></clipPath>
