    <linearGradient id="phoneBorder" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#13B9FD"/><stop offset="1" stop-color="#02569B"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#FFFFFF"/></pattern>
