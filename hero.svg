  <text x="80" y="256" class="mono" font-size="30" font-weight="700" fill="#13B9FD">&gt;</text>
  <text x="112" y="256" class="mono" font-size="30" font-weight="700" fill="#FFFFFF" textLength="306" lengthAdjust="spacingAndGlyphs" clip-path="url(#typeClip)">Flutter Developer</text>
  <rect x="418" y="230" width="3" height="32" fill="#13B9FD">
    <animate attributeName="x" values="112;130;148;166;184;202;220;238;256;274;292;310;328;346;364;382;400;418;418;418;418;418;418;418;418;418;418;418;418;418;418;418;418;400;382;364;346;328;310;292;274;256;238;220;202;184;166;148;130;112;112;112;112;112;112" dur="7s" calcMode="discrete" repeatCount="indefinite"/>
